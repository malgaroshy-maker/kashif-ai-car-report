<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="كاشف — فاحص أعطال السيارات بمصطلحات الورش الليبية">
  <!--
    Kashif AI — Social Preview / OpenGraph (1200x630)

    The fuse-box lid legend: moulded plate on board, the 15A blade fuse mark,
    and one honest sentence about what the app does. No fake screenshots.
  -->
  <defs>
    <style>
      .font-ar { font-family: 'Readex Pro', -apple-system, 'Segoe UI', system-ui, sans-serif; }
      .font-mono { font-family: 'Azeret Mono', ui-monospace, 'Cascadia Mono', monospace; }
    </style>
  </defs>

  <!-- Board background -->
  <rect width="1200" height="630" fill="#d5d7cf"/>

  <!-- Silkscreened Recessed Cell Plate -->
  <rect x="48" y="48" width="1104" height="534" fill="#f4f4f0" stroke="#a9ada5" stroke-width="2"/>
  <line x1="50" y1="50" x2="1150" y2="50" stroke="#eceee7" stroke-width="2"/>
  <line x1="50" y1="50" x2="50" y2="580" stroke="#eceee7" stroke-width="2"/>

  <!-- Top Bank Header & Rules -->
  <text x="80" y="98" class="font-mono" font-size="13" font-weight="600" fill="#525956" letter-spacing="0.12em">OBD-II / DIAGNOSTIC PROTOCOL</text>
  <text x="1120" y="98" text-anchor="end" class="font-ar" font-size="14" font-weight="600" fill="#525956" letter-spacing="0.04em">فاحص أعطال السيارات الذكي</text>

  <line x1="80" y1="116" x2="1120" y2="116" stroke="#a9ada5" stroke-width="2"/>
  <line x1="80" y1="118" x2="1120" y2="118" stroke="#eceee7" stroke-width="1"/>

  <!-- HERO SECTION (RTL) -->
  <!-- 15A Blade Fuse Mark (Right side) -->
  <g transform="translate(930, 160)">
    <!-- Terminal Blades -->
    <path d="M26 100 H50 V156 L44 164 H32 L26 156 Z" fill="#8a8f88"/>
    <rect x="32" y="126" width="12" height="12" fill="#f4f4f0"/>

    <path d="M90 100 H114 V156 L108 164 H96 L90 156 Z" fill="#8a8f88"/>
    <rect x="96" y="126" width="12" height="12" fill="#f4f4f0"/>

    <!-- Moulded Body in 15A Blue -->
    <path d="M10 20 H130 V60 L124 68 V108 H16 V68 L10 60 Z" fill="#2e7fc4"/>
    <rect x="10" y="20" width="120" height="6" fill="#82c0f0"/>
    <rect x="16" y="102" width="108" height="6" fill="#0f5288"/>

    <!-- Test Probe Apertures -->
    <rect x="30" y="20" width="20" height="6" fill="#8a8f88"/>
    <rect x="90" y="20" width="20" height="6" fill="#8a8f88"/>

    <!-- Rating Stamp -->
    <text x="70" y="32" fill="#f4f4f0" class="font-mono" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">15A</text>

    <!-- Translucent Element Window -->
    <rect x="28" y="36" width="84" height="54" fill="#0f5288"/>
    <rect x="28" y="36" width="84" height="3" fill="#083254"/>
    <rect x="28" y="87" width="84" height="3" fill="#2e7fc4"/>

    <!-- Terminal Posts -->
    <rect x="28" y="62" width="18" height="28" fill="#8a8f88"/>
    <rect x="94" y="62" width="18" height="28" fill="#8a8f88"/>

    <!-- Intact Stamped S-Element -->
    <path d="M36 74 H48 V48 H68 L80 78 H102 V74" fill="none" stroke="#f4f4f0" stroke-width="7"
          stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Arabic Wordmark & Subtitle Plate (Left of mark, anchored RTL) -->
  <g transform="translate(0, 0)">
    <text x="890" y="255" text-anchor="end" class="font-ar" font-size="88" font-weight="700" fill="#1a1d19" letter-spacing="-0.02em">كاشف</text>

    <!-- Stamped OBD Report Plate -->
    <rect x="730" y="278" width="160" height="36" rx="1" fill="#1a1d19"/>
    <text x="810" y="302" text-anchor="middle" class="font-mono" font-size="15" font-weight="600" fill="#f4f4f0" letter-spacing="0.1em">OBD REPORT</text>

    <!-- The One Honest Line -->
    <text x="890" y="375" text-anchor="end" class="font-ar" font-size="27" font-weight="500" fill="#1a1d19">
      يقرا تقرير جهاز الفحص ويترجمه لمصطلحات الورش الليبية،
    </text>
    <text x="890" y="415" text-anchor="end" class="font-ar" font-size="27" font-weight="500" fill="#4c524a">
      بأرقام قطع الغيار الأصلية والفحص المطلوب قبل ما تشري.
    </text>
  </g>

  <!-- BOTTOM LEGEND BAR: ISO/DIN 72581-3 Swatches -->
  <line x1="80" y1="475" x2="1120" y2="475" stroke="#a9ada5" stroke-width="1"/>
  <line x1="80" y1="476" x2="1120" y2="476" stroke="#eceee7" stroke-width="1"/>

  <g transform="translate(80, 500)">
    <!-- 10A Critical -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="1" fill="#a81f15"/>
      <path d="M22 13 L31 29 H13 Z" fill="#f4f4f0"/>
      <text x="42" y="25" class="font-mono" font-size="14" font-weight="700" fill="#f4f4f0">10A</text>
      <text x="160" y="25" text-anchor="end" class="font-ar" font-size="15" font-weight="700" fill="#f4f4f0">حرج</text>
    </g>

    <!-- 20A Moderate -->
    <g transform="translate(200, 0)">
      <rect width="180" height="38" rx="1" fill="#7a5500"/>
      <rect x="14" y="14" width="18" height="12" fill="none" stroke="#f4f4f0" stroke-width="2"/>
      <rect x="14" y="14" width="9" height="12" fill="#f4f4f0"/>
      <text x="42" y="25" class="font-mono" font-size="14" font-weight="700" fill="#f4f4f0">20A</text>
      <text x="160" y="25" text-anchor="end" class="font-ar" font-size="15" font-weight="700" fill="#f4f4f0">متوسط</text>
    </g>

    <!-- 25A History -->
    <g transform="translate(400, 0)">
      <rect width="180" height="38" rx="1" fill="#565c59"/>
      <circle cx="23" cy="20" r="7" fill="none" stroke="#f4f4f0" stroke-width="2.5"/>
      <text x="42" y="25" class="font-mono" font-size="14" font-weight="700" fill="#f4f4f0">25A</text>
      <text x="160" y="25" text-anchor="end" class="font-ar" font-size="15" font-weight="700" fill="#f4f4f0">ذاكرة</text>
    </g>

    <!-- 30A Passed -->
    <g transform="translate(600, 0)">
      <rect width="180" height="38" rx="1" fill="#125b2f"/>
      <path d="M15 20 L21 26 L31 13" fill="none" stroke="#f4f4f0" stroke-width="3" stroke-linecap="square"/>
      <text x="42" y="25" class="font-mono" font-size="14" font-weight="700" fill="#f4f4f0">30A</text>
      <text x="160" y="25" text-anchor="end" class="font-ar" font-size="15" font-weight="700" fill="#f4f4f0">سليم</text>
    </g>

    <!-- 15A Brand / Interactive -->
    <g transform="translate(800, 0)">
      <rect width="240" height="38" rx="1" fill="#0f5288"/>
      <rect x="14" y="12" width="18" height="15" rx="0.5" fill="#2e7fc4"/>
      <path d="M17 21 H19 V16 H23 L25 23 H29" fill="none" stroke="#f4f4f0" stroke-width="1.5"/>
      <text x="42" y="25" class="font-mono" font-size="14" font-weight="700" fill="#f4f4f0">15A</text>
      <text x="220" y="25" text-anchor="end" class="font-ar" font-size="15" font-weight="700" fill="#f4f4f0">كاشف (النظام)</text>
    </g>
  </g>
</svg>
