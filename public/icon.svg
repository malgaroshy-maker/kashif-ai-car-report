<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="كاشف">
<!--
  كاشف / KASHIF — app icon

  The ش of كاشف is an automotive blade fuse. The word does not read without
  it: the fuse is not an ornament beside the name, it IS the letter. That is
  why it survives every reduction, down to the favicon and the printed report.

  The letterforms are real Readex Pro outlines — the family the app already
  ships — shaped with HarfBuzz so the letters join correctly, then converted to
  paths. Hand-drawing Arabic is how you get a wordmark that reads as subtly
  wrong to everyone who speaks the language.

  Rebuilt by the scripts recorded in DESIGN.md § Identity.
-->

  <rect width="64" height="64" fill="#d5d7cf"/>
  <g transform="translate(-51.65 49.40) scale(0.0575 -0.0575)">
    <path d="M1134 310 h156 V552 l-53 53 h-50 l-53 -53 Z" fill="#8a8f88"/>
      <path d="M1403 310 h156 V552 l-53 53 h-50 l-53 -53 Z" fill="#8a8f88"/>
      <path d="M1672 310 h156 V552 l-53 53 h-50 l-53 -53 Z" fill="#8a8f88"/>
      <rect x="1009" y="0" width="890" height="330" fill="#2e7fc4"/>
      <rect x="1009" y="297" width="890" height="33" fill="#8fc7f0"/>
      <rect x="1009" y="0" width="890" height="33" fill="#0b3f6b"/>
      <rect x="1187" y="79" width="552" height="152" fill="#0b3f6b"/>
      <polyline points="1220 192 1342 192 1342 116 1518 116 1595 195 1706 195" fill="none" stroke="#f2f8fd" stroke-width="38" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
</svg>
