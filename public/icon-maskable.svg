<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="كاشف">
  <!--
    The same fuse, drawn for a maskable slot.

    Android crops a maskable icon to whatever shape the launcher uses — circle,
    squircle, teardrop — and only the middle 80% is guaranteed to survive. The
    fuse is scaled into that safe zone, so a round launcher does not shave the
    blades off.
  -->
  <rect width="64" height="64" fill="#d5d7cf"/>

  <g transform="translate(32 32) scale(0.62) translate(-32 -32)">
    <rect x="14" y="10" width="36" height="8" fill="#a9ada5"/>
    <rect x="20" y="12" width="7" height="16" fill="#8a8f88"/>
    <rect x="37" y="12" width="7" height="16" fill="#8a8f88"/>
    <rect x="14" y="24" width="36" height="30" rx="2" fill="#2e7fc4"/>
    <rect x="14" y="24" width="36" height="2" fill="#82c0f0"/>
    <rect x="14" y="52" width="36" height="2" fill="#0f5288"/>
    <path d="M23 33 L29 39 L35 33 L41 39" fill="none" stroke="#f4f4f0" stroke-width="3"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <text x="32" y="50" fill="#f4f4f0" font-family="ui-monospace, monospace"
          font-size="9" font-weight="700" text-anchor="middle">15A</text>
  </g>
</svg>
