name: Verify Kashif AI

# This workflow does NOT deploy.
#
# The live Worker is deployed by **Cloudflare Workers Builds**, which is
# connected to this repository from the Cloudflare dashboard and builds on
# every push. Two systems publishing the same Worker is a race, so this one
# stops at verification and Cloudflare does the shipping.
#
# The build settings live in the dashboard, not in this repo, which is exactly
# why they drifted out of sync with the code. They are documented in README.md
# under "النشر على Cloudflare Workers" so the correct values are at least
# written down somewhere that reviews with the code.
#
# (An earlier version of this file ran `wrangler pages deploy .next` — the
# wrong Cloudflare product entirely — so it had never deployed anything.)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build & e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 24, to match what the project is developed and built on.
      #
      # This workflow spent a day and a half failing on `npm ci` before the
      # first step ran: "package.json and package-lock.json are not in sync,
      # Missing: esbuild@0.28.2". The lock is fine — it installs cleanly here
      # and on the machine that wrote it. What differed was npm: the lock is
      # written by the npm that ships with Node 24, and the npm in Node 22
      # read the same file as incomplete. Verifying on a different toolchain
      # than the one the code is built with is how that goes unnoticed.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # A hard gate as of the schema-validation change: the AI response
      # boundary is typed now, so there are no `no-explicit-any` errors left
      # to wave through. Two `no-img-element` warnings remain and are allowed.
      - name: Lint
        run: npx eslint .

      # These guard the property the whole product rests on: that it never
      # states a finding about a car it did not read. Every case in the suite
      # is something a real version of this app once invented.
      - name: Test
        run: npm test

      - name: Build for Cloudflare
        run: npm run cf:build

      # End to end against the built Worker, not against `next dev`. Every bug
      # this project found at the deployment boundary was invisible in dev:
      # /api/models returning 500 from an edge-incompatible import, and the
      # whole build directory being served as public assets. The suite drives
      # the demo reports, which need no API key.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The bug the Cloudflare migration exists to close: the deploy used to
      # publish the entire .next directory as public assets, including
      # .next/server/** and the system prompt inside it.
      #
      # The dashboard's deploy command still carries `--assets=.next`, and a
      # CLI flag overrides the assets.directory set in wrangler.jsonc — so this
      # check cannot be enforced from here. What it CAN do is prove the built
      # asset directory is clean, and fail loudly if a change ever widens it.
      - name: Assert the published asset directory holds nothing sensitive
        run: |
          set -e
          fail=0
          for path in \
            .open-next/assets/server \
            .open-next/assets/build-manifest.json \
            .open-next/assets/required-server-files.json \
            .open-next/assets/app-path-routes-manifest.json \
            .open-next/assets/cache
          do
            if [ -e "$path" ]; then
              echo "::error::$path is inside the published asset directory"
              fail=1
            fi
          done
          echo "Published entries:"
          ls -1 .open-next/assets
          exit $fail
