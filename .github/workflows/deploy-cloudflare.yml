name: Deploy Kashif AI to Cloudflare Workers

# The previous version of this file ran `wrangler pages deploy .next`, which
# targets Cloudflare *Pages*, while production is a *Worker* named `kashif`.
# It had therefore never deployed the live site — and had it succeeded it would
# have served static assets with no API routes at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build & e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # A hard gate as of the schema-validation change: the AI response
      # boundary is typed now, so there are no `no-explicit-any` errors left
      # to wave through. Two `no-img-element` warnings remain and are allowed.
      - name: Lint
        run: npx eslint .

      # These guard the property the whole product rests on: that it never
      # states a finding about a car it did not read. Every case in the suite
      # is something a real version of this app once invented.
      - name: Test
        run: npm test

      - name: Build for Cloudflare
        run: npm run cf:build

      # End to end against the built Worker, not against `next dev`. Every bug
      # this project found at the deployment boundary was invisible in dev:
      # /api/models returning 500 from an edge-incompatible import, and the
      # whole build directory being served as public assets. The suite drives
      # the demo reports, which need no API key.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy Worker
    needs: verify
    runs-on: ubuntu-latest
    # Deploying needs credentials. Without them the job is skipped rather than
    # failing the run, so a fork or a contributor's push still gets verified.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set — skipping deploy."
          fi

      - name: Build and deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy

      # The bug this whole migration exists to close: the deploy used to
      # publish the entire .next directory as public assets. If any of these
      # ever return 200 again, the asset directory has been widened.
      # (/BUILD_ID is deliberately not listed — the adapter publishes it by
      # design and it carries nothing sensitive.)
      - name: Assert build internals are not published
        if: steps.creds.outputs.ready == 'true'
        run: |
          BASE=https://kashif.malgaroshy.workers.dev
          fail=0
          for path in /build-manifest.json /required-server-files.json /server/app/index.html /app-path-routes-manifest.json /cache/.rscinfo; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$BASE$path")
            if [ "$code" = "200" ]; then
              echo "::error::$path is publicly readable (HTTP 200)"
              fail=1
            else
              echo "ok: $path -> $code"
            fi
          done
          exit $fail
